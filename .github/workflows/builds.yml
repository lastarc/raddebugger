name: builds

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

env:
  TORTURE_FLAGS: "--gen_crash_dump" 

jobs:
  build-ubuntu-24:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - raddbg
          - raddbg_non_graphical
          - radlink
          - radbin
          - torture
        compiler:
          - clang-17
          - clang-22
          - gcc
    
    name: ${{ matrix.target }}-${{ matrix.compiler }}-ubuntu24

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install Common Dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libfreetype6-dev libx11-dev libxext-dev libxfixes-dev libxrandr-dev libgl1-mesa-dev libegl1-mesa-dev

      - name: Install clang-17 Dependencies
        if: ${{ matrix.compiler == 'clang-17' }}
        shell: bash
        run: |
          sudo apt-get install --no-install-recommends -y clang-17 lld-17 llvm-17
          sudo ln -sf /usr/bin/llvm-symbolizer-17 /usr/bin/llvm-symbolizer
          echo CC="${{ matrix.compiler }}" >> "${GITHUB_ENV}"
          echo AR=llvm-ar-17               >> "${GITHUB_ENV}"

      - name: Install ${{ matrix.compiler }} Dependencies
        if: ${{ matrix.compiler == 'clang-22' }}
        shell: bash
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo apt-add-repository -y "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main"
          sudo apt-get update
          sudo apt-get install -y clang-22 lld-22 llvm-22
          sudo ln -sf /usr/bin/llvm-symbolizer-22 /usr/bin/llvm-symbolizer
          echo CC="${{ matrix.compiler }}" >> "${GITHUB_ENV}"
          echo AR=llvm-ar-22               >> "${GITHUB_ENV}"

      - name: Build (debug)
        shell: bash
        run: |
          export CC_BUILD="${{ matrix.compiler }}"
          ./build.sh "${{ matrix.target }}" debug ${CC_BUILD%%-*}

      - name: Build (release)
        shell: bash
        run: |
          export CC_BUILD="${{ matrix.compiler }}"
          ./build.sh "${{ matrix.target }}" release ${CC_BUILD%%-*}

  build-windows-vs2022:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        target:
          - raddbg
          - radlink
          - radbin
          - mule_main
        compiler:
          - msvc
          - clang

    name: ${{ matrix.target }}-${{ matrix.compiler }}-vs2022
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true
      - name: Build (debug)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64 || exit /b 1
          call build meta "${{ matrix.target }}" "${{ matrix.compiler }}" debug                                || exit /b 1
      - name: Build (debug)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64 || exit /b 1
          call build meta "${{ matrix.target }}" "${{ matrix.compiler }}" release                              || exit /b 1

  build-windows-vs2026:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        target:
          - raddbg
          - radlink
          - radbin
          - mule_main
        compiler:
          - msvc
          - clang

    name: ${{ matrix.target }}-${{ matrix.compiler }}-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true
      - name: Build (debug)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64 || exit /b 1
          call build meta "${{ matrix.target }}" "${{ matrix.compiler }}" debug                              || exit /b 1
      - name: Build (release)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64 || exit /b 1
          call build meta "${{ matrix.target }}" "${{ matrix.compiler }}" release                            || exit /b 1

  run-ubuntu-24-04:
    runs-on: ubuntu-24.04
    if: false
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - clang-22
          # TODO: - gcc
        mode:
          - debug
          # TODO: - release
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true
      - name: Install Dependencies
        shell: bash
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo apt-add-repository -y "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main"
          sudo apt-get update
          sudo apt-get install -y clang-22 lld-22 llvm-22 gcc-14 pkg-config libfreetype6-dev libx11-dev libxext-dev libxfixes-dev libxrandr-dev libgl1-mesa-dev libegl1-mesa-dev
          # crash callstack symbolizer depends on LLVM
          sudo ln -s /usr/bin/llvm-symbolizer-22 /usr/bin/llvm-symbolizer
      - name: Run
        shell: bash
        run: |
          [[ "${{ matrix.compiler }}" == "clang-22" ]] && export AR=llvm-ar-22
          CC="${{ matrix.compiler }}" ./run_tests.sh clang "${{ matrix.mode }}" -- \* $TORTURE_FLAGS 
      - name: Upload Artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: torture-crash-dumps-${{ matrix.compiler }}-${{ matrix.mode }}
          path: |
            build/*.core
            build/*.exe
            build/*.pdb
            build/torture_artifacts/**
          if-no-files-found: ignore

  run-windows-2022:
    runs-on: windows-2022
    if: false
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - msvc
          - clang
        mode:
          - debug
          - release
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true
      - name: Run
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_INSTALL=%%i"
          call "%VS_INSTALL%\VC\Auxiliary\Build\vcvarsall.bat" x64
          call run_tests.bat ${{ matrix.compiler }} ${{ matrix.mode }} -- * %TORTURE_FLAGS% || exit /b 1
      - name: Upload Artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: torture-crash-dumps-${{ matrix.compiler }}-${{ matrix.mode }}
          path: |
            build/*.dmp
            build/*.exe
            build/*.pdb
            build/torture_artifacts/**
          if-no-files-found: ignore

  build-macos-15-intel:
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        target:
          - raddbg
          - raddbg_non_graphical
          - raddbg_server
          - radbin

    name: ${{ matrix.target }}-clang-macos15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Build (debug)
        shell: bash
        run: |
          ./build.sh "${{ matrix.target }}" debug clang

      - name: Build (release)
        shell: bash
        run: |
          ./build.sh "${{ matrix.target }}" release clang

  test-macos-15-intel:
    runs-on: macos-15-intel
    name: mac-demon-tests-macos15-intel
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Build
        shell: bash
        run: |
          ./build.sh radbin raddbg_non_graphical mac_demon_test debug clang
          echo "::notice title=build::radbin, raddbg_non_graphical & mac_demon_test built"

      - name: Demon Tests
        timeout-minutes: 6
        shell: bash
        run: |
          set +e
          sudo perl -e 'alarm 240; exec @ARGV' env GITHUB_ACTIONS=true ./build/mac_demon_test ./build/mac_demon_test_target > build/demon_test.txt 2>&1 < /dev/null
          code=$?
          sudo pkill -9 -f mac_demon_test_target
          cat build/demon_test.txt
          exit $code

      - name: Upload Demon Test Output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mac-demon-test-output
          path: build/demon_test.txt
          if-no-files-found: ignore

      - name: Debug Info Conversion
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        shell: bash
        run: |
          ./build/radbin --rdi build/mac_demon_test_target --out:build/mac_demon_test_target.rdi
          ./build/radbin --dump build/mac_demon_test_target.rdi > build/mac_demon_test_target.rdi.txt
          grep -q "'target_func'" build/mac_demon_test_target.rdi.txt
          grep -q "'target_caller'" build/mac_demon_test_target.rdi.txt
          grep -q "mac_demon_test_target.c" build/mac_demon_test_target.rdi.txt
          echo "::notice title=radbin::Mach-O/dSYM -> RDI conversion OK"

  e2e-macos-15-intel:
    runs-on: macos-15-intel
    name: mac-e2e-test-macos15-intel
    # NOTE: manual only, for now: see the known issue below
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Build
        shell: bash
        run: ./build.sh raddbg_non_graphical mac_demon_test debug clang

      - name: End-To-End Test
        timeout-minutes: 8
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # NOTE: known issue: on these runners, a debugging session w/ raddbg
          # attached often makes the whole runner VM stop responding (anywhere
          # from seconds to a minute in), cause unknown. Root processes can't be killed by the runner, so everything
          # run w/ sudo is time-limited from the inside, & progress is mirrored
          # into a check run (mac-e2e-progress), visible even if the runner stops
          # responding.
          set +e
          mkdir -p build/e2e
          echo "e2e: starting" > build/e2e_test.txt
          check_id=$(gh api -X POST repos/${{ github.repository }}/check-runs -f name=mac-e2e-progress -f head_sha=${{ github.sha }} -f status=in_progress --jq .id 2>/dev/null)
          if [ -n "$check_id" ]; then
            sudo env GH_TOKEN="$GH_TOKEN" python3 src/mac/tests/ci_monitor.py ${{ github.repository }} "$check_id" build/e2e_test.txt build/e2e/logs/ctrl_thread.raddbg_log > build/e2e/monitor.txt 2>&1 &
          fi
          sudo perl -e 'alarm 180; exec @ARGV' env GITHUB_ACTIONS=true ./src/mac/tests/e2e_test.sh build >> build/e2e_test.txt 2>&1 < /dev/null
          code=$?
          sudo pkill -9 -f raddbg_non_graphical
          sudo pkill -9 -f mac_demon_test_target
          sudo pkill -f ci_monitor.py
          [ -n "$check_id" ] && gh api -X PATCH repos/${{ github.repository }}/check-runs/$check_id -f status=completed -f conclusion=$([ $code = 0 ] && echo success || echo failure) > /dev/null 2>&1
          cat build/e2e_test.txt
          exit $code

      - name: Upload End-To-End Test Output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mac-e2e-test-output
          path: |
            build/e2e_test.txt
            build/e2e/
          if-no-files-found: ignore

  gui-smoke-macos-15-intel:
    runs-on: macos-15-intel
    name: gui-smoke-test-macos15-intel
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Build
        shell: bash
        run: |
          ./build.sh raddbg debug clang
          echo "::notice title=build::raddbg built"

      - name: GUI Smoke Test
        timeout-minutes: 10
        shell: bash
        run: |
          ./build/raddbg > build/raddbg_output.txt 2>&1 < /dev/null &
          pid=$!
          sleep 20
          if ps -p "$pid" > /dev/null; then
            echo "::notice title=raddbg::running after 20s"
            kill -9 "$pid"
            code=0
          else
            code=0
            wait "$pid" || code=$?
            echo "::error title=raddbg::exited early (code $code)"
            code=1
          fi
          head -c 4000 build/raddbg_output.txt
          exit $code
